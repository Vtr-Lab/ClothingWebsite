<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <title>My First Page</title>
    </head>
    <body>
        <h1 class="shop-title">Victor's T-shirt Shop</h1>
        <p id="titletext">
            Welcome to the official site for buying my clothes! Click on the color boxes to try different color scheme for your clothes!
        </p>
        <div class="side-barcode">*vtr lab*</div>
        <div id="colorswitcher">
            <div id='b1' class="button" onclick="logo.src='Clothes/redlogo.png';"></div>
            <div id='b2' class="button" onclick="logo.src='Clothes/orangelogo.png';"></div>
            <div id='b3' class="button" onclick="logo.src='Clothes/yellowlogo.png';"></div>
            <div id='b4' class="button" onclick="logo.src='Clothes/greenlogo.png';"></div>
            <div id='b5' class="button" onclick="logo.src='Clothes/bluelogo.png';"></div>
            <div id='b6' class="button" onclick="logo.src='Clothes/pinklogo.png';"></div>
        </div>
        <br><br>
        <div id="tshirtswitcher">
            <div id='a1' class="button" onclick="tshirt.src='Clothes/whiteshirt.png';"></div>
            <div id='a2' class="button" onclick="tshirt.src='Clothes/blackshirt.png';"></div>
        </div>
        <br><br>
        <img id="logo" src="Clothes/redlogo.png" name="logo">
        <img id="tshirt" src="Clothes/whiteshirt.png" name="tshirt">
    </body>
</html>
